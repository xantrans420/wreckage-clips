<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE BENCH</title>
<meta name="description" content="Five benchmarks for whether AI can actually do creative work. PaintBench: one painting, recreated as SVG code, tracked over time.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700&family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap">
<style>
  :root {
    --bg:#0a0a0a; --bg2:#111; --bg3:#1a1a1a; --bg4:#222; --border:#2a2a2a; --border2:#333;
    --text:#e0e0e0; --text2:#888; --text3:#555; --accent:#ff3c00; --accent2:#ff7a00; --accent3:#ffcc00;
    --green:#00ff88; --blue:#00aaff; --red:#ff2244;
    /* Chart marks are stepped for the dark surface (OKLCH L 0.48-0.67); the brighter
       --green above is text, where WCAG contrast is the governing check. */
    --viz-accent:#17a862; --viz-mute:#8a8a8a;
    /* Surface behind artwork. Entries must paint their full canvas, so this shows
       only at the edges and behind anything that left the canvas transparent. */
    --mat:#161616;
    --mono:'Space Mono',ui-monospace,monospace; --display:'Bebas Neue',Impact,sans-serif; --body:'Inter',system-ui,sans-serif;
  }
  /* Committed single-theme design: the page paints its own ground so it holds on
     any host background. */
  html{color-scheme:dark;background:var(--bg)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:13px;line-height:1.6;min-height:100vh;overflow-x:hidden}
  a{color:var(--blue);text-decoration:none} a:hover{text-decoration:underline}
  :focus-visible{outline:2px solid var(--accent3);outline-offset:2px}
  body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.03) 2px,rgba(0,0,0,.03) 4px);pointer-events:none;z-index:9999}

  /* ---------------------------------------------------------------- header */
  .header{padding:20px 24px 0;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:100}
  .header-top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 20px;margin-bottom:14px}
  .logo{font-family:var(--display);font-size:40px;letter-spacing:5px;color:var(--accent);line-height:.9}
  .tagline{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);padding-bottom:3px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto;padding-bottom:2px}
  .chip{font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border:1px solid var(--border2);color:var(--text2);background:var(--bg2)}
  .chip b{color:var(--text);font-weight:700}
  .chip.judge{border-color:var(--accent);color:var(--accent)}

  .tabs{display:flex;gap:0;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;padding:10px 15px;border:none;background:transparent;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;white-space:nowrap;display:flex;align-items:center;gap:7px}
  .tab:hover{color:var(--text)}
  .tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
  .tab .st{width:6px;height:6px;border-radius:50%;background:var(--text3);flex:none}
  .tab .st.live{background:var(--viz-accent)}
  .tab .st.spec{background:var(--accent3)}

  .banner{margin:16px 24px 0;padding:10px 14px;border:1px solid var(--accent3);color:var(--accent3);font-family:var(--mono);font-size:11px;letter-spacing:.5px;line-height:1.7;background:rgba(255,204,0,.06)}
  .banner code{color:var(--text)}

  .content{padding:24px;max-width:1320px;margin:0 auto}
  .panel[hidden]{display:none}
  h2{font-family:var(--display);font-size:26px;letter-spacing:3px;color:var(--text);margin:34px 0 12px}
  h2:first-child{margin-top:0}
  h2 small{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--text3);margin-left:12px;text-transform:uppercase}
  .intro{color:var(--text2);max-width:78ch;margin-bottom:6px}
  .intro b{color:var(--text)}
  .empty{padding:60px 24px;text-align:center;color:var(--text2);font-family:var(--mono);font-size:12px;line-height:2}
  .empty code{color:var(--accent3)}

  .tracksel{display:flex;gap:0;border:1px solid var(--border2);width:max-content;margin:16px 0 6px}
  .tracksel button{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;padding:8px 16px;border:none;background:transparent;color:var(--text3);cursor:pointer;border-right:1px solid var(--border2)}
  .tracksel button:last-child{border-right:none}
  .tracksel button[aria-pressed="true"]{background:var(--accent);color:#000;font-weight:700}
  .tracksel button:hover:not([aria-pressed="true"]){color:var(--text)}
  .trackblurb{color:var(--text2);max-width:78ch;margin-bottom:4px}

  .briefcard{border:1px solid var(--border);background:var(--bg2);padding:18px;margin-bottom:14px;display:grid;grid-template-columns:1fr 300px;gap:22px;align-items:start}
  .briefcard .txt{font-size:14px;line-height:1.75;color:var(--text);border-left:2px solid var(--accent);padding-left:14px}
  .briefcard h4{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:8px}
  .briefcard ol{list-style:none;counter-reset:c;font-family:var(--mono);font-size:10px;color:var(--text2);line-height:1.5}
  .briefcard li{counter-increment:c;padding:3px 0 3px 22px;position:relative}
  .briefcard li::before{content:counter(c,decimal-leading-zero);position:absolute;left:0;color:var(--text3)}
  .noref{font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--accent3);border:1px solid var(--accent3);padding:4px 9px;display:inline-block;margin-bottom:12px}

  /* ---------------------------------------------------------------- charts */
  .chart{border:1px solid var(--border);background:var(--bg2);padding:16px 16px 8px;position:relative}
  .chart svg{display:block;width:100%;height:auto;overflow:visible}
  .chart .axlabel{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;fill:var(--text3)}
  .chart .tick{font-family:var(--mono);font-size:9px;fill:var(--text3)}
  .chart .grid{stroke:var(--border);stroke-width:1}
  .chart .axis{stroke:var(--border2);stroke-width:1}
  .chart .dotrank{font-family:var(--mono);font-size:10px;font-weight:700;fill:var(--bg2);pointer-events:none}
  .chart g[data-slug]{cursor:pointer}
  .chart g[data-slug]:focus{outline:none}
  .chart g[data-slug]:focus .dot,.chart .dot.hi{stroke:var(--text)}
  .chart .front{stroke:var(--viz-accent);stroke-width:2;fill:none;opacity:.45}
  .chart .hit{fill:transparent}
  .chart .corner{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;fill:var(--viz-accent)}
  .chart .note{font-family:var(--mono);font-size:9px;letter-spacing:.5px;color:var(--text3);padding-top:6px;line-height:1.7}
  .chart .series{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .chart .endlabel{font-family:var(--mono);font-size:10px;dominant-baseline:middle}
  .tip{position:fixed;z-index:500;pointer-events:none;background:var(--bg3);border:1px solid var(--border2);padding:8px 10px;font-family:var(--mono);font-size:10px;color:var(--text2);line-height:1.7;display:none;max-width:250px}
  .tip b{color:var(--text);font-family:var(--body);font-size:12px;display:block;margin-bottom:3px}
  .tip .on{color:var(--viz-accent)}

  /* ----------------------------------------------------------------- table */
  .tablewrap{overflow-x:auto;border:1px solid var(--border);background:var(--bg2)}
  table{border-collapse:collapse;width:100%;min-width:940px;font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}
  th,td{padding:9px 10px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
  th{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);font-weight:400;background:var(--bg3);position:sticky;top:0}
  th:nth-child(2),td:nth-child(2){text-align:left}
  th:first-child,td:first-child{text-align:center;width:44px}
  tbody tr:hover td{background:var(--bg3)}
  .rank{font-family:var(--display);font-size:20px;color:var(--text2)}
  tbody tr:nth-child(1) .rank{color:var(--accent3)} tbody tr:nth-child(2) .rank{color:var(--text)} tbody tr:nth-child(3) .rank{color:var(--accent2)}
  .model{font-family:var(--body);font-size:13px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:7px}
  .model small{display:block;font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.5px;font-weight:400}
  .swatch{width:8px;height:8px;border-radius:50%;flex:none}
  .score{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end}
  .score b{font-size:14px;min-width:38px;text-align:right}
  .bar{width:80px;height:6px;background:var(--bg4);position:relative;overflow:hidden}
  .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--c,var(--accent))}
  .dim{color:var(--text3)} .warn{color:var(--accent3)} .bad{color:var(--red)} .good{color:var(--viz-accent)}

  /* --------------------------------------------------------------- gallery */
  .subject{display:grid;grid-template-columns:220px 1fr;gap:18px;align-items:start;border:1px solid var(--border);background:var(--bg2);padding:16px;margin-bottom:14px}
  .subject .plate{width:100%;aspect-ratio:var(--ar,1);max-height:300px;background:var(--mat);overflow:hidden}
  .subject .plate img{width:100%;height:100%;object-fit:contain;display:block}
  .subject h3{font-family:var(--display);font-size:30px;letter-spacing:2px;line-height:1;margin-bottom:4px}
  .pmeta{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;line-height:1.9}
  .tier{display:inline-block;font-family:var(--display);font-size:13px;letter-spacing:1px;padding:0 6px;border:1px solid var(--accent3);color:var(--accent3);margin-right:6px;vertical-align:middle}

  .evorow{border:1px solid var(--border);background:var(--bg2);margin-bottom:10px;display:grid;grid-template-columns:190px 1fr}
  .evorow .who{padding:12px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:4px;justify-content:center}
  .evorow .who .nm{font-weight:600;font-size:13px;display:flex;align-items:center;gap:7px}
  .evorow .shots{display:flex;gap:8px;padding:12px;overflow-x:auto;scrollbar-width:thin}
  .shot{flex:0 0 132px;display:flex;flex-direction:column;gap:5px;cursor:pointer;border:1px solid transparent;padding:5px;background:none;text-align:left;font:inherit;color:inherit}
  .shot:hover{border-color:var(--border2);background:var(--bg3)}
  .shot .fr{width:100%;aspect-ratio:var(--ar,1);background:var(--mat);overflow:hidden;position:relative}
  .shot .fr img{width:100%;height:100%;object-fit:contain;display:block}
  .shot .fail{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg4);color:var(--text3);font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;text-align:center;padding:6px}
  .shot .cap{font-family:var(--mono);font-size:9px;color:var(--text3);display:flex;justify-content:space-between;gap:6px;align-items:baseline}
  .shot .cap b{font-family:var(--display);font-size:16px;letter-spacing:1px;color:var(--c,var(--text))}

  /* ------------------------------------------------------------ spec cards */
  .spec{max-width:82ch}
  .spec .q{font-family:var(--display);font-size:38px;letter-spacing:2px;line-height:1.05;color:var(--text);margin-bottom:10px;text-wrap:balance}
  .spec .lede{color:var(--text2);font-size:14px;margin-bottom:22px}
  .spec .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:22px}
  .spec .grid div{background:var(--bg2);padding:11px 13px}
  .spec .grid dt{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-bottom:3px}
  .spec .grid dd{color:var(--text);font-size:12px;line-height:1.55}
  .spec h4{font-family:var(--mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin:0 0 8px}
  .spec ul{list-style:none;display:flex;flex-direction:column;gap:7px;margin-bottom:22px}
  .spec li{padding-left:18px;position:relative;color:var(--text2)}
  .spec li::before{content:'';position:absolute;left:0;top:8px;width:7px;height:1px;background:var(--accent)}
  .quote{border-left:2px solid var(--accent);padding:2px 0 2px 14px;font-size:17px;line-height:1.45;color:var(--text);font-weight:300;margin-bottom:20px;text-wrap:balance}
  .statustag{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;padding:2px 8px;border:1px solid var(--border2);color:var(--text2);margin-bottom:14px}
  .statustag.live{border-color:var(--viz-accent);color:var(--viz-accent)}
  .statustag.spec{border-color:var(--accent3);color:var(--accent3)}

  /* ----------------------------------------------------------------- modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:10000;padding:20px}
  .modal.open{display:flex}
  .mbox{background:var(--bg2);border:1px solid var(--border2);max-width:1180px;width:100%;max-height:100%;overflow:auto;padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .mbox .pane{background:var(--bg);display:flex;align-items:center;justify-content:center;aspect-ratio:var(--ar,1);max-height:68vh}
  .mbox .pane img{max-width:100%;max-height:68vh;object-fit:contain;background:var(--mat)}
  .mhead{grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .mhead h3{font-family:var(--display);font-size:28px;letter-spacing:2px;line-height:1}
  .close{font-family:var(--mono);color:var(--text2);cursor:pointer;border:1px solid var(--border2);padding:4px 10px;background:none;font-size:12px}
  .mfoot{grid-column:1/-1;display:grid;grid-template-columns:2fr 1fr;gap:16px;font-size:12px}
  .verdict{color:var(--text);line-height:1.6;border-left:2px solid var(--accent);padding-left:12px}
  .kv{font-family:var(--mono);font-size:10px;color:var(--text2);display:grid;grid-template-columns:auto 1fr;gap:3px 12px}
  .kv b{color:var(--text)}
  .issues{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
  .issue{font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;border:1px solid var(--border2);padding:1px 6px;color:var(--text2)}
  .crit{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
  .crit div{background:var(--bg3);padding:6px 8px;font-family:var(--mono);font-size:10px;color:var(--text2)}
  .crit b{display:block;font-family:var(--display);font-size:22px;color:var(--text);letter-spacing:1px}

  .footer{padding:30px 24px;border-top:1px solid var(--border);color:var(--text3);font-family:var(--mono);font-size:10px;letter-spacing:1px;line-height:1.9}
  @media (max-width:620px){.spec .grid{grid-template-columns:1fr}}
  @media (max-width:820px){
    .briefcard{grid-template-columns:1fr}
    .subject{grid-template-columns:1fr}
    .evorow{grid-template-columns:1fr}
    .evorow .who{border-right:none;border-bottom:1px solid var(--border);flex-direction:row;align-items:center;gap:10px}
    .mbox{grid-template-columns:1fr}
    .mfoot{grid-template-columns:1fr}
    .logo{font-size:32px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="header">
  <div class="header-top">
    <div>
      <div class="logo" id="suiteName">THE BENCH</div>
      <div class="tagline" id="suiteTagline"></div>
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
</div>
<div id="banner"></div>
<div class="content" id="app"><div class="empty">loading…</div></div>
<div class="footer" id="footer"></div>
<div class="tip" id="tip"></div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtBytes = (n) => n == null ? '–' : n > 1e6 ? (n/1e6).toFixed(1)+' MB' : n > 1e3 ? (n/1e3).toFixed(0)+' KB' : n+' B';
const fmtMs = (n) => n == null ? '–' : n >= 60e3 ? (n/60e3).toFixed(1)+' min' : (n/1e3).toFixed(1)+' s';
const fmtDate = (d) => new Date(d + 'T00:00:00Z').toLocaleDateString('en-GB', { month: 'short', year: '2-digit', timeZone: 'UTC' });
const scoreColor = (t) => t == null ? 'var(--text3)' : t >= 70 ? 'var(--green)' : t >= 45 ? 'var(--accent3)' : t >= 20 ? 'var(--accent2)' : 'var(--red)';

// Validated categorical steps for a dark surface, assigned in fixed order by the
// model's stable roster position - never by rank, so re-sorting never repaints.
const SERIES = ['#3987e5','#d95926','#199e70','#c98500','#d55181','#008300','#9085e9','#e66767'];
const hueOf = (m) => SERIES[(m.order ?? 0) % SERIES.length];

const params = new URLSearchParams(location.search);
const RESULTS = (params.get('results') || 'results').replace(/[^a-z0-9_-]/gi, '');
let DATA = null, SUITE = null, ACTIVE = 'paint';

async function main(){
  const [suite, board] = await Promise.all([
    fetch('benches.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null),
    fetch(`${RESULTS}/leaderboard.json`, { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null),
  ]);
  SUITE = suite || { suite: { name: 'THE BENCH', tagline: '' }, benches: [] };
  DATA = board;
  $('#suiteName').textContent = SUITE.suite.name;
  $('#suiteTagline').textContent = SUITE.suite.tagline;
  $('#footer').innerHTML = `Reference images: Wikimedia Commons, public domain · Contestants work from a text prompt only, never a reference image · The judge never sees the SVG source or the model name · <a href="https://github.com/xantrans420/wreckage-clips/tree/main/bench">source &amp; method</a>`;
  renderTabs();
  renderChips();
  show(location.hash.slice(1) || 'paint');
}

function renderTabs(){
  $('#tabs').innerHTML = SUITE.benches.map(b =>
    `<button class="tab" role="tab" id="tab-${b.slug}" aria-controls="panel-${b.slug}" aria-selected="false" onclick="show('${b.slug}')"><span class="st ${b.status}"></span>${esc(b.name)}</button>`).join('');
}

function renderChips(){
  if(!DATA){ $('#chips').innerHTML = ''; return; }
  const runs = DATA.runs.length;
  $('#chips').innerHTML = [
    `<span class="chip judge">judge <b>${esc(DATA.judge.models.join(', ') || '–')}</b></span>`,
    `<span class="chip"><b>${runs}</b> run${runs === 1 ? '' : 's'}</span>`,
    `<span class="chip">latest <b>${esc(DATA.latestRun || '–')}</b></span>`,
    `<span class="chip"><b>${Object.keys(DATA.tracks || {}).length}</b> tracks</span>`,
    `<span class="chip">prompt v<b>${DATA.promptVersion}</b> · rubric v<b>${DATA.rubricVersion}</b></span>`,
  ].join('');
}

function show(slug){
  if(!SUITE.benches.some(b => b.slug === slug)) slug = 'paint';
  ACTIVE = slug;
  history.replaceState(null, '', '#' + slug);
  for(const b of SUITE.benches){
    const t = $('#tab-' + b.slug);
    if(t) t.setAttribute('aria-selected', String(b.slug === slug));
  }
  const bench = SUITE.benches.find(b => b.slug === slug);
  // The mock notice is about the figures, so it rides with the tab that has them.
  $('#banner').innerHTML = (slug === 'paint' && DATA?.mock)
    ? `<div class="banner">MOCK RUN · every figure below comes from <code>paintbench smoke</code> pipeline-test data. The contestants are stand-ins and the scores are derived from image bytes, not judged. The scoring, the frontier, the history and the gallery are the real thing.</div>` : '';
  $('#app').innerHTML = slug === 'paint' ? renderPaint() : renderSpec(bench);
  if(slug === 'paint') wireCharts();
}
window.show = show;

/* ============================================================== PaintBench */
/* Two tracks, scored on different rubrics, so they are never pooled into one
   number. The switcher picks which one the whole panel is showing. */
let TRACK = 'recall';
const track = () => DATA?.tracks?.[TRACK];

function renderPaint(){
  if(!DATA) return `<div class="empty">No results published yet.<br><br>Run <code>cd bench &amp;&amp; npm install &amp;&amp; npm run refs &amp;&amp; npm run run</code>, then commit <code>bench/results/</code>.</div>`;
  const keys = Object.keys(DATA.tracks || {});
  if(!keys.length) return `<div class="empty">No runs recorded yet.</div>`;
  if(!DATA.tracks[TRACK]) TRACK = keys[0];
  const t = track();
  const sel = keys.map(k => `<button aria-pressed="${k === TRACK}" onclick="setTrack('${k}')">${esc(DATA.tracks[k].label)}</button>`).join('');
  return `
  <div class="tracksel" role="group" aria-label="Benchmark track">${sel}</div>
  <p class="trackblurb">${esc(t.blurb)}</p>
  <p class="intro">Scored 0&ndash;100, weighted: ${t.rubric.map(r => `<b>${esc(r.key)} ${Math.round(r.weight * 100)}%</b>`).join(', ')}.
  The task never changes, so re-running it is how you watch models improve. Disqualified or broken entries count as 0.</p>
  ${!t.models.length ? '<div class="empty">Nothing judged on this track yet.</div>' : renderEvolution(t) + renderScatter(t) + renderTable(t) + renderGallery(t)}`;
}

function setTrack(k){
  TRACK = k;
  $('#app').innerHTML = renderPaint();
  wireCharts();
  window.scrollTo({ top: 0, behavior: 'auto' });
}
window.setTrack = setTrack;

/* The headline view: the same task, scored again each run. */
function renderEvolution(t){
  const pts = t.models.filter(m => m.history.length);
  const runs = DATA.runs.map(r => r.id);
  if(!pts.length || runs.length < 2){
    return `<h2>Progress over time <small>the same task, run after run</small></h2>
    <div class="chart"><div class="note" style="padding:26px 4px;text-align:center;font-size:11px">
      Only ${runs.length} run recorded. The trend appears from the second run onward &mdash; that comparison is the point of holding the task fixed.</div></div>`;
  }
  const W = 900, H = 340, ML = 46, MR = 132, MT = 22, MB = 42;
  const pw = W - ML - MR, ph = H - MT - MB;
  const x = i => ML + (runs.length === 1 ? pw / 2 : (i / (runs.length - 1)) * pw);
  const y = v => MT + 8 + (1 - v / 100) * (ph - 16);
  const grid = [0,25,50,75,100].map(v => `<line class="grid" x1="${ML}" y1="${y(v).toFixed(1)}" x2="${ML+pw}" y2="${y(v).toFixed(1)}"/>
    <text class="tick" x="${ML-8}" y="${(y(v)+3).toFixed(1)}" text-anchor="end">${v}</text>`).join('');
  const step = Math.ceil(runs.length / 8);
  const xax = runs.map((r, i) => (i % step === 0 || i === runs.length - 1)
    ? `<text class="tick" x="${x(i).toFixed(1)}" y="${MT+ph+16}" text-anchor="middle">${esc(fmtDate(r))}</text>` : '').join('');
  const ends = [];
  const lines = pts.map(m => {
    const hue = hueOf(m);
    const pxs = m.history.map(h => ({ i: runs.indexOf(h.run), v: h.total })).filter(p => p.i >= 0);
    if(!pxs.length) return '';
    const last = pxs[pxs.length - 1];
    let ly = y(last.v);
    while(ends.some(e => Math.abs(e - ly) < 13)) ly += 13;
    ends.push(ly);
    return `<g data-slug="${m.slug}" tabindex="0" role="listitem" aria-label="${esc(m.label)}: ${pxs.map(p => `${fmtDate(runs[p.i])} scored ${p.v}`).join(', ')}">
      <polyline class="series" points="${pxs.map(p => `${x(p.i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ')}" stroke="${hue}"/>
      ${pxs.map(p => `<circle cx="${x(p.i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3.5" fill="${hue}" stroke="var(--bg2)" stroke-width="1.5"/>`).join('')}
      <text class="endlabel" x="${(x(last.i)+11).toFixed(1)}" y="${ly.toFixed(1)}" fill="${hue}">${esc(m.label)}</text>
    </g>`;
  }).join('');
  return `<h2>Progress over time <small>the same task, run after run</small></h2>
  <div class="chart">
    <svg viewBox="0 0 ${W} ${H}" role="list" aria-label="Score for each model across every recorded run on this track.">
      ${grid}
      <line class="axis" x1="${ML}" y1="${MT}" x2="${ML}" y2="${MT+ph}"/>
      <line class="axis" x1="${ML}" y1="${MT+ph}" x2="${ML+pw}" y2="${MT+ph}"/>
      ${xax}
      <text class="axlabel" transform="translate(12,${MT+ph}) rotate(-90)" x="0" y="0">Score 0-100</text>
      ${lines}
    </svg>
    <div class="note">Each line is one model on the identical task. A line that climbs is a model getting better at something it was measured on before; a new line is a model that did not exist at the earlier runs.</div>
  </div>`;
}

function renderScatter(t){
  const pts = t.models.filter(m => m.avgLatencyMs > 0 && m.judged > 0);
  if(pts.length < 2) return '';
  const W = 900, H = 340, ML = 46, MR = 26, MT = 24, MB = 44;
  const pw = W - ML - MR, ph = H - MT - MB;
  let tmin = Math.min(...pts.map(p => p.avgLatencyMs)), tmax = Math.max(...pts.map(p => p.avgLatencyMs));
  if(tmax - tmin < 1e-6){ tmin = Math.max(0, tmin * 0.9); tmax = tmax * 1.1 + 1; }
  const pad = (tmax - tmin) * 0.08; tmin = Math.max(0, tmin - pad); tmax += pad;
  const x = v => ML + ((v - tmin) / (tmax - tmin)) * pw;
  const y = v => MT + 10 + (1 - v / 100) * (ph - 20);
  const grid = [0,25,50,75,100].map(v => `<line class="grid" x1="${ML}" y1="${y(v).toFixed(1)}" x2="${ML+pw}" y2="${y(v).toFixed(1)}"/>
    <text class="tick" x="${ML-8}" y="${(y(v)+3).toFixed(1)}" text-anchor="end">${v}</text>`).join('');
  const xax = [0,.25,.5,.75,1].map(f => tmin + f * (tmax - tmin))
    .map(v => `<text class="tick" x="${x(v).toFixed(1)}" y="${MT+ph+16}" text-anchor="middle">${fmtMs(v)}</text>`).join('');
  const front = pts.filter(p => p.pareto).sort((a,b) => a.avgLatencyMs - b.avgLatencyMs);
  const frontLine = front.length > 1
    ? `<polyline class="front" points="${front.map(p => `${x(p.avgLatencyMs).toFixed(1)},${y(p.overall).toFixed(1)}`).join(' ')}"/>` : '';
  const dots = pts.map(p => {
    const px = x(p.avgLatencyMs), py = y(p.overall);
    return `<g data-slug="${p.slug}" tabindex="0" role="listitem" aria-label="${esc(p.label)}: score ${p.overall.toFixed(1)} of 100, ${fmtMs(p.avgLatencyMs)} on average${p.pareto ? ', on the speed and quality frontier' : ''}">
      <circle class="hit" cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="18"/>
      <circle class="dot" cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="10" fill="${p.pareto ? 'var(--viz-accent)' : 'var(--viz-mute)'}" stroke="var(--bg2)" stroke-width="2"/>
      <text class="dotrank" x="${px.toFixed(1)}" y="${(py+3.4).toFixed(1)}" text-anchor="middle">${p.rank}</text>
    </g>`;
  }).join('');
  return `<h2>Speed vs. output <small>latest run: how long it took, how good it was</small></h2>
  <div class="chart">
    <svg viewBox="0 0 ${W} ${H}" role="list" aria-label="Score against average generation time, one point per model. Full figures are in the table below.">
      ${grid}
      <line class="axis" x1="${ML}" y1="${MT}" x2="${ML}" y2="${MT+ph}"/>
      <line class="axis" x1="${ML}" y1="${MT+ph}" x2="${ML+pw}" y2="${MT+ph}"/>
      ${xax}
      <text class="corner" x="${ML+6}" y="${MT+28}">Fast and good</text>
      <text class="axlabel" x="${ML}" y="${H-6}">Average time per picture</text>
      <text class="axlabel" transform="translate(12,${MT+ph}) rotate(-90)" x="0" y="0">Score 0-100</text>
      ${frontLine}${dots}
    </svg>
    <div class="note">Numbers are leaderboard rank; the table below is the key. Green marks the speed/quality frontier: no other model is both faster and better. Grey models are beaten outright on both axes.</div>
  </div>`;
}

function renderTable(t){
  const keys = t.rubric.map(r => r.key);
  const rows = t.models.map(m => {
    const dq = m.disqualified + m.failed, d = m.delta;
    return `<tr>
      <td><span class="rank">${m.rank}</span></td>
      <td><div class="model"><span class="swatch" style="background:${hueOf(m)}"></span><span>${esc(m.label)}<small>${esc(m.provider)} · ${esc(m.model)}</small></span></div></td>
      <td><span class="score"><span class="bar" style="--c:${scoreColor(m.overall)}"><i style="width:${m.overall}%"></i></span><b style="color:${scoreColor(m.overall)}">${m.overall.toFixed(1)}</b></span></td>
      <td class="${d == null ? 'dim' : d > 0 ? 'good' : d < 0 ? 'bad' : 'dim'}">${d == null ? 'first run' : (d > 0 ? '+' : '') + d.toFixed(1)}</td>
      ${keys.map(k => `<td>${(m.criteria[k] ?? 0).toFixed(1)}</td>`).join('')}
      <td class="${dq ? 'bad' : 'dim'}">${dq}</td>
      <td class="dim">${fmtBytes(m.avgBytes)}</td>
      <td><b>${fmtMs(m.avgLatencyMs)}</b></td>
      <td class="dim">${fmtMs(m.medianLatencyMs)}</td>
      <td class="dim">${esc(m.firstSeen ? fmtDate(m.firstSeen) : '–')}</td>
    </tr>`;
  }).join('');
  const SHORT = { recognizability:'Recog', composition:'Comp', color:'Colour', craft:'Craft',
                  impression:'Impr', adherence:'Brief', likeness:'Likeness' };
  const short = k => SHORT[k] || k;
  return `<h2>Leaderboard <small>latest run · weighted score 0&ndash;100</small></h2>
  <div class="tablewrap"><table>
    <thead><tr><th>#</th><th>Model</th><th>Score</th><th title="change since this model's first run">Δ since first</th>${keys.map(k => `<th title="${esc(k)}">${esc(short(k))}</th>`).join('')}<th>DQ/Fail</th><th>Avg SVG</th><th>Avg time</th><th>Median</th><th>Since</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

/* One row per model: every attempt at the fixed subject, oldest run to newest. */
function renderGallery(t){
  const s = t.subject;
  const rows = t.models.map(m => {
    const shots = t.timeline[m.slug] || [];
    if(!shots.length) return '';
    const cells = shots.map(e => {
      const ok = e.png && e.status === 'ok' && !e.disqualified;
      return `<button class="shot" style="--ar:${s.aspect};--c:${scoreColor(e.total)}" onclick="openModal('${m.slug}','${e.run}')">
        <span class="fr">${ok ? `<img loading="lazy" src="${esc(e.png)}" alt="${esc(m.label)}, ${esc(e.run)}">`
          : `<span class="fail">${esc(e.disqualified ? 'disqualified' : e.status.replace(/_/g, ' '))}</span>`}</span>
        <span class="cap"><span>${esc(fmtDate(e.run))}</span><b>${e.total == null ? '–' : e.total.toFixed(0)}</b></span>
      </button>`;
    }).join('');
    return `<div class="evorow">
      <div class="who"><span class="nm"><span class="swatch" style="background:${hueOf(m)}"></span>${esc(m.label)}</span>
        <span class="pmeta">${esc(m.provider)} · ${shots.length} run${shots.length === 1 ? '' : 's'}</span></div>
      <div class="shots">${cells}</div></div>`;
  }).join('');
  return `<h2>Every attempt <small>oldest run to newest · click any frame</small></h2>
  ${s.track === 'brief' ? briefCard(s) : subjectCard(s)}
  ${rows}`;
}

function subjectCard(s){
  return `<div class="subject" style="--ar:${s.aspect}">
    <div class="plate">${s.ref ? `<img src="${esc(s.ref)}" alt="${esc(s.title)}">` : ''}</div>
    <div><span class="tier">${esc(s.tier)}</span><h3 style="display:inline">${esc(s.title)}</h3>
      <div class="pmeta">${esc(s.artist)} · ${esc(s.year)} · ${esc(s.medium || '')}<br>
      ${s.commonsUrl ? `<a href="${esc(s.commonsUrl)}" target="_blank" rel="noopener">Wikimedia Commons</a> · ${esc(s.license || '')}` : ''}</div>
      <p class="intro" style="margin-top:12px">The constant. Every run asks every model for this one painting, from memory, so the only thing that changes between runs is the models themselves.</p>
    </div></div>`;
}

/* The brief track has no reference image and never had one - the words are the
   whole input, so the words are what the page shows. */
function briefCard(s){
  return `<div class="briefcard">
    <div>
      <span class="noref">No reference image exists</span>
      <h3 style="font-family:var(--display);font-size:30px;letter-spacing:2px;line-height:1;margin-bottom:6px">${esc(s.title)}</h3>
      <div class="pmeta" style="margin-bottom:12px">${esc(s.format)}${s.subject ? ' · figure: ' + esc(s.subject) : ''}</div>
      <p class="txt">${esc(s.brief)}</p>
      <p class="intro" style="margin-top:14px">The constant. Every model gets these words and nothing else &mdash; no picture to copy, no painting to recall. Everything on screen had to be invented from the description.</p>
    </div>
    <div><h4>Named elements the judge checks</h4>
      <ol>${(s.checklist || []).map(c => `<li>${esc(c)}</li>`).join('')}</ol></div>
  </div>`;
}

/* ============================================================ spec panels */
function renderSpec(b){
  return `<div class="spec">
    <span class="statustag ${b.status}">${b.status === 'live' ? 'Running' : b.status === 'spec' ? 'Specified, not running' : 'Planned'}</span>
    <div class="q">${esc(b.question)}</div>
    <p class="lede">${esc(b.summary)}</p>
    <dl class="grid">
      <div><dt>Role</dt><dd>${esc(b.role)}</dd></div>
      <div><dt>Judge</dt><dd>${esc(b.judge)}</dd></div>
      <div><dt>Cost</dt><dd>${esc(b.cost)}</dd></div>
      <div><dt>Reach</dt><dd>${esc(b.virality)} virality</dd></div>
    </dl>
    <h4>What it measures</h4>
    <ul>${b.measures.map(m => `<li>${esc(m)}</li>`).join('')}</ul>
    <h4>The finding it is chasing</h4>
    <blockquote class="quote">${esc(b.headline)}</blockquote>
    ${b.doc ? `<p class="pmeta"><a href="${esc(b.doc)}">Read the full specification &rarr;</a></p>` : ''}
  </div>`;
}

/* ================================================================= wiring */
function wireCharts(){
  const tip = $('#tip');
  const t = track();
  if(!t) return;
  document.querySelectorAll('.chart g[data-slug]').forEach(g => {
    const m = t.models.find(x => x.slug === g.dataset.slug);
    if(!m) return;
    const dot = g.querySelector('.dot');
    const move = ev => {
      const hist = m.history.length > 1
        ? `<br>${m.history.length} runs · ${m.delta > 0 ? '+' : ''}${m.delta ?? 0} since ${esc(fmtDate(m.firstSeen))}` : '';
      tip.innerHTML = `<b>${esc(m.label)}</b>score <span class="on">${m.overall.toFixed(1)}</span> / 100<br>avg ${fmtMs(m.avgLatencyMs)} · median ${fmtMs(m.medianLatencyMs)}<br>${fmtBytes(m.avgBytes)} avg SVG${hist}${m.pareto ? '<br><span class="on">on the frontier</span>' : ''}`;
      tip.style.display = 'block';
      const r = tip.getBoundingClientRect();
      tip.style.left = Math.min((ev.clientX ?? 40) + 14, innerWidth - r.width - 8) + 'px';
      tip.style.top = Math.min((ev.clientY ?? 40) + 14, innerHeight - r.height - 8) + 'px';
      dot?.classList.add('hi');
    };
    g.addEventListener('mousemove', move);
    g.addEventListener('focus', move);
    const off = () => { tip.style.display = 'none'; dot?.classList.remove('hi'); };
    g.addEventListener('mouseleave', off);
    g.addEventListener('blur', off);
  });
}

function openModal(mslug, run){
  const t = track();
  const m = t?.models.find(x => x.slug === mslug);
  const s = t?.subject;
  const e = (t?.timeline[mslug] || []).find(x => x.run === run);
  if(!m || !e) return;
  const ok = e.status === 'ok' && !e.disqualified;
  const CRITK = t.rubric.map(r => r.key);
  $('#mbox').innerHTML = `
    <div class="mhead"><div><h3>${esc(m.label)} <span style="color:var(--text3)">/</span> ${esc(fmtDate(e.run))}</h3>
      <div class="pmeta">${esc(s.title)}${s.track === 'brief' ? ' · brief only, no reference' : ` · ${esc(s.artist)}, ${esc(s.year)}`}</div></div>
      <div style="display:flex;gap:10px;align-items:center"><span style="font-family:var(--display);font-size:40px;letter-spacing:2px;color:${scoreColor(e.total)}">${e.total == null ? '–' : e.total.toFixed(1)}</span>
      <button class="close" onclick="closeModal()">ESC</button></div></div>
    <div class="pane" style="--ar:${s.aspect}">${s.ref ? `<img src="${esc(s.ref)}" alt="original">`
      : `<div class="txt" style="padding:18px;font-size:12px;line-height:1.7;color:var(--text2);border-left:2px solid var(--accent);margin:14px">${esc(s.brief || '')}</div>`}</div>
    <div class="pane" style="--ar:${s.aspect}">${ok && e.svg ? `<img src="${esc(e.svg)}" alt="candidate">`
      : `<div class="pmeta" style="padding:20px;text-align:center">${esc(e.disqualified ? 'DISQUALIFIED: ' + e.reasons.join(', ') : e.status)}</div>`}</div>
    <div class="mfoot">
      <div><div class="verdict">${esc(e.verdict || 'No verdict.')}</div>
        ${e.issues?.length ? `<div class="issues">${e.issues.map(i => `<span class="issue">${esc(i)}</span>`).join('')}</div>` : ''}
        ${e.scores ? `<div class="crit">${CRITK.map(c => `<div>${esc(c.slice(0, 6))}<b>${e.scores[c]}</b></div>`).join('')}</div>` : ''}</div>
      <div class="kv">
        <span>run</span><b>${esc(e.run)}</b>
        <span>status</span><b>${esc(e.status)}${e.disqualified ? ' · DQ' : ''}</b>
        <span>svg</span><b>${e.svg ? `<a href="${esc(e.svg)}" target="_blank" rel="noopener">open source</a> · ${fmtBytes(e.stats?.bytes)}` : '–'}</b>
        <span>elements</span><b>${e.stats ? `${e.stats.elements} (${e.stats.paths} paths, ${e.stats.gradients} gradients)` : '–'}</b>
        <span>text stripped</span><b>${e.strippedText || 0}</b>
        <span>gen time</span><b>${fmtMs(e.latencyMs)}</b>
        <span>tokens</span><b>${e.usage ? `${e.usage.input ?? '?'} in / ${e.usage.output ?? '?'} out` : '–'}</b>
        <span>served by</span><b>${esc(e.servedBy || m.model)}</b>
      </div></div>`;
  $('#modal').classList.add('open');
}
function closeModal(){ $('#modal').classList.remove('open'); }
window.openModal = openModal; window.closeModal = closeModal;
$('#modal').addEventListener('click', ev => { if(ev.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', ev => { if(ev.key === 'Escape') closeModal(); });
main();
</script>
</body>
</html>
